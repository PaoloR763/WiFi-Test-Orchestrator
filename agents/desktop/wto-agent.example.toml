[agent]
environment = "production"
server_url = "https://orchestrator.example"
state_dir = "/var/lib/wto-agent"
artifact_staging_timeout_seconds = 300
artifact_reconciliation_timeout_seconds = 30
artifact_reconciliation_grace_seconds = 5
artifact_retention_max_age_seconds = 2592000
artifact_retention_count = 1000
artifact_retention_bytes = 10737418240
artifact_prune_batch_limit = 100
request_timeout_seconds = 15
heartbeat_interval_seconds = 30
polling_interval_seconds = 5
max_concurrency = 1
shutdown_grace_seconds = 15
backoff_initial_seconds = 1
backoff_max_seconds = 60
backoff_multiplier = 2
backoff_jitter_ratio = 0.2
allowed_plugins = ["protocol.contract_check"]
allow_in_memory_secret_store = false
allow_local_wifi_control = false
allowed_interface_guids = []
allowed_wifi_profiles = []
windows_inventory_timeout_seconds = 30
linux_inventory_timeout_seconds = 10
wifi_scan_cooldown_seconds = 15
wifi_scan_timeout_seconds = 8
node_role = "endpoint"
linux_secret_backend = "secret_service"
linux_secret_service_total_timeout_seconds = 5
linux_secret_service_operation_timeout_seconds = 2
capture_enabled = false
allowed_capture_interfaces = []
protected_capture_interfaces = []
allowed_capture_channels = []
allowed_capture_frequencies_mhz = []
allowed_capture_widths_mhz = [20]
capture_max_duration_seconds = 300
capture_max_size_bytes = 104857600
flent_enabled = false
flent_allowed_servers = []
tcpreplay_enabled = false
allowed_replay_interfaces = []
allowed_replay_scenarios = []
approved_replay_artifacts = {}
replay_max_duration_seconds = 60
replay_max_rate_mbps = 100
replay_max_loops = 1
replay_max_size_bytes = 104857600
log_level = "INFO"
