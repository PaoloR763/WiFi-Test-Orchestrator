[agent]
environment = "production"
server_url = "https://orchestrator.example"
state_dir = "/var/lib/wto-agent-capture"
artifacts_dir = "/var/lib/wto-agent-capture/artifacts"
artifact_staging_timeout_seconds = 300.0
artifact_reconciliation_timeout_seconds = 30.0
artifact_reconciliation_grace_seconds = 5.0
artifact_retention_max_age_seconds = 2592000
artifact_retention_count = 1000
artifact_retention_bytes = 10737418240
artifact_prune_batch_limit = 100
node_role = "capture_node"
linux_secret_backend = "encrypted_file"
linux_secret_service_total_timeout_seconds = 5.0
linux_secret_service_operation_timeout_seconds = 2.0
capture_enabled = false
allowed_capture_interfaces = []
protected_capture_interfaces = []
allowed_capture_channels = []
allowed_capture_frequencies_mhz = []
allowed_capture_widths_mhz = [20]
capture_max_duration_seconds = 300
capture_max_size_bytes = 104857600
flent_enabled = false
flent_allowed_servers = []
tcpreplay_enabled = false
allowed_replay_interfaces = []
allowed_replay_scenarios = []
approved_replay_artifacts = {}
replay_max_duration_seconds = 60
replay_max_rate_mbps = 100
replay_max_loops = 1
replay_max_size_bytes = 104857600
allowed_plugins = ["protocol.contract_check"]
log_level = "INFO"
