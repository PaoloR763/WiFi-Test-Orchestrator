[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "wto-desktop-agent"
version = "0.1.0"
description = "Shared Windows and Linux runtime for WiFi Test Orchestrator agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1",
  "jsonschema==4.25.1",
  "pydantic==2.11.7",
  "pywin32==311; sys_platform == 'win32'",
  "secretstorage==3.3.3; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
  "black==25.1.0",
  "hypothesis==6.135.20",
  "mypy==1.16.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.0.0",
  "pytest-cov==6.2.1",
  "ruff==0.12.1",
  "pyinstaller==6.21.0",
]

[project.scripts]
wto-agent = "wto_desktop_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wto_desktop_agent = [
  "contract_data/**/*",
  "infrastructure/sqlite/versions/*.sql",
  "platforms/windows/scripts/*.ps1",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
  "jsonschema",
  "jsonschema.*",
  "secretstorage",
  "secretstorage.*",
  "servicemanager",
  "pywintypes",
  "win32api",
  "win32con",
  "win32cred",
  "win32event",
  "win32file",
  "win32job",
  "win32pipe",
  "win32process",
  "win32security",
  "win32service",
  "win32serviceutil",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "wto_desktop_agent.platforms.windows.ip_helper",
  "wto_desktop_agent.platforms.windows.native_wifi.bindings",
  "wto_desktop_agent.platforms.windows.network_controller",
  "wto_desktop_agent.platforms.windows.npcap",
]
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: requires the Phase 04 backend dependencies",
  "windows: requires native Windows",
  "linux: requires native Linux",
]
