[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "wto-desktop-agent"
version = "0.1.0"
description = "Shared Windows and Linux runtime for WiFi Test Orchestrator agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1",
  "jsonschema==4.25.1",
  "pydantic==2.11.7",
  "pywin32==311; sys_platform == 'win32'",
  "secretstorage==3.3.3; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
  "black==25.1.0",
  "hypothesis==6.135.20",
  "mypy==1.16.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.0.0",
  "pytest-cov==6.2.1",
  "ruff==0.12.1",
]

[project.scripts]
wto-agent = "wto_desktop_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wto_desktop_agent = ["contract_data/**/*", "infrastructure/sqlite/versions/*.sql"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*", "secretstorage", "secretstorage.*", "win32cred", "win32job", "win32api", "win32con"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: requires the Phase 04 backend dependencies",
  "windows: requires native Windows",
  "linux: requires native Linux",
]
