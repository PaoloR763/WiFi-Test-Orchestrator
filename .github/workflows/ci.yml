name: phase-05-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Generate ephemeral CI secrets
        run: python scripts/generate_env.py
      - name: Validate repository guardrails
        run: |
          python scripts/build_openapi.py --check
          python scripts/check_contract_compatibility.py --verify-release
          python scripts/validate_repository.py
      - name: Validate Compose syntax and policy
        run: |
          docker compose config --quiet
          python tests/compose/test_compose_policy.py
      - name: Backend lint, format, types, and tests
        run: |
          docker compose --profile tools build backend-tools
          docker compose --profile tools run --rm --no-deps backend-tools ruff check src tests migrations
          docker compose --profile tools run --rm --no-deps backend-tools black --check src tests migrations
          docker compose --profile tools run --rm --no-deps backend-tools mypy src
          docker compose --profile tools run --rm --no-deps backend-tools python scripts/validate_contracts.py
          docker compose --profile tools run --rm --no-deps backend-tools python scripts/check_openapi_drift.py
          docker compose --profile tools run --rm --no-deps backend-tools pytest --cov=wto_backend --cov-report=term-missing
          sh scripts/dev.sh test-integration
      - name: Frontend lint, format, types, tests, and build
        run: |
          docker compose --profile tools build frontend-tools
          docker compose --profile tools run --rm frontend-tools npm run lint
          docker compose --profile tools run --rm frontend-tools npm run format-check
          docker compose --profile tools run --rm frontend-tools npm run typecheck
          docker compose --profile tools run --rm frontend-tools npm test
          docker compose --profile tools run --rm frontend-tools npm run build
      - name: Build runtime images
        run: docker compose build
      - name: Clean-environment smoke test
        run: sh scripts/smoke.sh
      - name: Compose logs after failure
        if: failure()
        run: docker compose logs --no-color || true

  contracts-typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2
      - run: docker compose --profile contracts build contracts-typescript
      - run: docker compose --profile contracts run --rm contracts-typescript

  contracts-kotlin:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6.0.2
      - run: docker compose --profile contracts build contracts-kotlin
      - run: docker compose --profile contracts run --rm contracts-kotlin

  contracts-swift:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6.0.2
      - run: docker compose --profile contracts build contracts-swift
      - run: docker compose --profile contracts run --rm contracts-swift

  desktop-agent-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Verify derived desktop contracts
        run: python scripts/sync_desktop_contracts.py --check
      - name: Build desktop test image
        run: docker build --file agents/desktop/Dockerfile --target test --tag wto-desktop-agent-test .
      - name: Desktop lint, format, types, tests and wheel
        run: |
          docker run --rm --workdir /workspace/agents/desktop wto-desktop-agent-test ruff check src tests
          docker run --rm --workdir /workspace/agents/desktop wto-desktop-agent-test black --check src tests
          docker run --rm --workdir /workspace/agents/desktop wto-desktop-agent-test mypy src
          docker run --rm --workdir /workspace/agents/desktop wto-desktop-agent-test mypy --platform linux src
          docker run --rm --workdir /workspace/agents/desktop wto-desktop-agent-test mypy --platform win32 src
          docker run --rm --workdir /workspace/agents/desktop wto-desktop-agent-test pytest tests --cov=wto_desktop_agent --cov-report=term-missing
          docker run --rm wto-desktop-agent-test python scripts/test_desktop_wheel.py

  desktop-agent-windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            agents/desktop/requirements.lock
            agents/desktop/requirements-dev.lock
      - name: Verify derived desktop contracts
        run: python scripts/sync_desktop_contracts.py --check
      - name: Install locked desktop dependencies
        run: |
          python -m pip install --requirement agents/desktop/requirements-dev.lock
          python -m pip install --no-deps --editable agents/desktop
          python -m pip check
      - name: Desktop lint, format and types
        working-directory: agents/desktop
        run: |
          ruff check src tests
          black --check src tests
          mypy src
          mypy --platform linux src
          mypy --platform win32 src
      - name: Native Windows adapter and security tests
        working-directory: agents/desktop
        run: pytest tests/windows -m windows -vv
      - name: Desktop SQLite, CLI and core tests
        working-directory: agents/desktop
        run: pytest tests --ignore=tests/windows --cov=wto_desktop_agent --cov-report=term-missing
      - name: Build and install clean desktop wheel
        run: python scripts/test_desktop_wheel.py
